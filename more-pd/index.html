<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOnet Learn - Free EdTech Professional Development</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neo-blue': '#063672',
                        'neo-gold': '#E9BE5A',
                        'neo-light-blue': '#1e5296', 
                    },
                    fontFamily: {
                        'title': ['Lilita One', 'Roboto', 'sans-serif'],
                        'body': ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="flex flex-col min-h-screen">

    <div id="navbar"></div>

    <main class="flex-grow">
        <div class="relative overflow-hidden min-h-[85vh] flex items-center py-16 md:py-24 bg-neo-blue">
            
            <!-- Main Responsive Layout Grid -->
            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-20 z-10 w-full">
                
                <!-- Left Side: NEOnet Learn Logo -->
                <div class="w-full lg:w-1/2 flex justify-center lg:justify-end">
                    <img src="../images/neonetlearnlogo.svg" alt="NEOnet Learn Logo" class="w-full h-auto max-w-lg">
                </div>
                
                <!-- Right Side: Heading, Description, and Action Button -->
                <div class="w-full lg:w-1/2 text-center lg:text-left flex flex-col items-center lg:items-start">
                    <h1 class="text-4xl md:text-5xl lg:text-6xl text-white mb-6 leading-tight drop-shadow-sm">
                        Need more PD before NEOTech?
                    </h1>
                    
                    <p class="text-xl md:text-2xl lg:text-3xl text-gray-200 font-medium mb-10 max-w-2xl leading-relaxed">
                        Get free on-demand EdTech PD for CEUs or Graduate Credit with <span class="text-neo-gold font-bold">NEOnet Learn</span>!
                    </p>
                    
                    <!-- Call to Action Button with high-contrast Gold background -->
                    <div class="w-full max-w-md lg:max-w-none">
                        <a href="https://learn.neonet.org" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="inline-block bg-neo-gold text-neo-blue px-12 py-5 rounded-full font-bold text-xl md:text-2xl hover:bg-white hover:text-neo-blue transition-all-200 shadow-xl w-full lg:w-auto text-center tracking-wide transform hover:-translate-y-1 duration-200">
                            Visit NEOnet Learn
                        </a>
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Unified Nav Fetch & Mobile Menu Script -->
    <script>
        fetch('/nav.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load nav.html');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('navbar').innerHTML = data;
                
                // Re-initialize mobile menu toggle listeners after dynamic insertion
                const btn = document.getElementById('mobile-menu-button');
                const menu = document.getElementById('mobile-menu');
                const iconClosed = document.getElementById('menu-icon-closed');
                const iconOpen = document.getElementById('menu-icon-open');

                if (btn && menu) {
                    btn.addEventListener('click', () => {
                        const expanded = btn.getAttribute('aria-expanded') === 'true';
                        btn.setAttribute('aria-expanded', !expanded);
                        menu.classList.toggle('open');
                        iconClosed.classList.toggle('hidden');
                        iconClosed.classList.toggle('block');
                        iconOpen.classList.toggle('hidden');
                        iconOpen.classList.toggle('block');
                    });
                }
            })
            .catch(error => console.error('Error loading navigation:', error));

        fetch('/footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load footer.html');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
