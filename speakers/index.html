<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speakers | NEOTech 2027</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neo-blue': '#063672',
                        'neo-gold': '#E9BE5A',
                        'neo-light-blue': '#1e5296',
                    },
                    fontFamily: {
                        'title': ['Lilita One', 'Roboto', 'sans-serif'],
                        'body': ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen">

<div id="navbar"></div>

<main class="flex-grow">
    <!-- Hero Banner Section -->
    <div class="bg-neo-blue py-16 lg:py-24 border-b-8 border-neo-gold">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <a href="../">
                <img src="../images/neotech27whitelogo.svg" 
                     alt="Neotech Logo" 
                     class="mx-auto mb-6 h-16 w-auto" 
                />
            </a>
            
            <h1 class="text-4xl md:text-5xl lg:text-6xl text-white font-title tracking-wide mb-4">
                Speakers
            </h1>
            <p class="max-w-3xl mx-auto text-lg md:text-xl text-gray-200 leading-relaxed font-body">
                Meet the educators, innovators, and EdTech leaders sharing practical strategies and inspiration at NEOTech 2027.
            </p>
        </div>
    </div>

    <!-- Whova Speaker Directory Section -->
    <section class="py-12 lg:py-16 bg-slate-100">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="whova-widget-container">
                <div title="Whova event and conference app" id="whova-speakerwidget">
                    <p id="whova-loading">Loading...</p>
                </div>
                <script src="https://whova.com/static/frontend/xems/js/whova-speaker-widget.js?eid=-H-qazJFWwezUMo95kvfyOK1b6LE7v9uMu1oTGRClhk%3D&host=https://whova.com" type="text/javascript" id="embeded-speaker-script">
                </script>
                <div id="whova-wrap" class="whova-wrap-class">
                    Powered By
                    <a class="brandlink" target="_blank" href="https://whova.com">
                        <b>Whova</b>
                    </a>
                    <br/>
                    <a class="whova-emslink brandanchorlink" target="_blank" href="https://whova.com/abstract-management/">
                        Abstract submission software
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="footer"></div>

<script>
    fetch('/nav.html')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load nav.html');
            }
            return response.text();
        })
        .then(data => {
            document.getElementById('navbar').innerHTML = data;
            
            // Re-initialize mobile menu toggle listeners after dynamic insertion
            const btn = document.getElementById('mobile-menu-button');
            const menu = document.getElementById('mobile-menu');
            const iconClosed = document.getElementById('menu-icon-closed');
            const iconOpen = document.getElementById('menu-icon-open');

            if (btn && menu) {
                btn.addEventListener('click', () => {
                    const expanded = btn.getAttribute('aria-expanded') === 'true';
                    btn.setAttribute('aria-expanded', !expanded);
                    menu.classList.toggle('open');
                    iconClosed.classList.toggle('hidden');
                    iconClosed.classList.toggle('block');
                    iconOpen.classList.toggle('hidden');
                    iconOpen.classList.toggle('block');
                });
            }
        })
        .catch(error => console.error('Error loading navigation:', error));

    fetch('/footer.html')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load footer.html');
            }
            return response.text();
        })
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        })
        .catch(error => console.error('Error loading footer:', error));
</script>
</body>
</html>
